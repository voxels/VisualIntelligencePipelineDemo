name: EdgeDaemon
options:
  bundleIdPrefix: com.secretatomics.visualintelligence
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  DiverKit:
    path: ../DiverKit
  DiverShared:
    path: ../DiverShared

targets:
  EdgeDaemon:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "*.entitlements"
          - Info.plist
          - build.log
          - export
          - run_daemon.sh
          - README.md
    dependencies:
      - package: DiverKit
      - package: DiverShared
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDisplayName: Visual Intelligence Node
        NSLocalNetworkUsageDescription: The Visual Intelligence Node serves AI inference to your iPhone over your local network via Bonjour.
        NSBonjourServices:
          - _visualintel._tcp
    settings:
      base:
        PRODUCT_NAME: "Visual Intelligence Node"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: EdgeDaemon.entitlements
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.secretatomics.visualintelligence.node

schemes:
  EdgeDaemon:
    build:
      targets:
        EdgeDaemon: all
    run:
      config: Debug
    profile:
      config: Release
